# OpenSSF Scorecard: scores this repository against supply-chain security
# best practices (pinned dependencies, token permissions, branch protection,
# dangerous workflow patterns, ...) and publishes the results. Findings go to
# the Security tab. This file follows the OpenSSF template on purpose:
# publishing results requires a restricted workflow (no top-level env or
# defaults, no run steps, only approved actions).

name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 7 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

# read-all is the OpenSSF template's setting: several checks read pull request,
# check-run and repository metadata that narrower grants would hide. It grants
# no write access; the job below adds only the two writes it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to the Security tab
      id-token: write          # publish results to the OpenSSF API (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: results.sarif
